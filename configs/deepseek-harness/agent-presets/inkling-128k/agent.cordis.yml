# Inkling 128K Optimized Local Coding Preset (RTX 3090 SM 8.6 · Wave 10)
# Empirically tuned from live Inkling-2-Mini + DeepSeek Harness sessions:
#  1. Slim 13-tool catalog (disables single-GPU-hostile subagents/workflows + offline web_search
#     + unused goal/skill tools): cuts cold prompt overhead from ~9,000 -> ~3,500 tokens and
#     shrinks the GBNF tool-call grammar by >55 %.
#  2. Inkling-2-Mini persona rules: enforces native read/edit/write/grep/glob (eliminates slow
#     inline `python3 - << EOF` / `sed` bash hacks), verify-after-edit checks, parallel read
#     batching, concise reasoning, and screenshot hygiene.
#  3. Bounded `tool-fs` read window (`readLimit: 400`, `readMaxBytes: 32768`) + per-tool
#     append-only `spill-policy` (bash=12KB, grep=12KB, glob=8KB, read=28KB, 0 ms KV invalidation).
#  4. `tool-result-pruner` disabled (eliminates 77s retroactive KV cache invalidation).
#  5. `compaction-basic` at `thresholdRatio: 0.72` (~94K), `retainTokens: 16384`, `maxTokens: 16384`
#     (keeps sessions in the 110-165 t/s RTX 3090 sweet spot with zero fail-closed truncation loops).

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a fast, disciplined coding agent powered by {{model}}. Working directory: {{cwd}}.

      Core operating rules:
      1. Native tools first — NEVER use bash for `cat`, `sed`, `head`, `tail`, `grep`, `rg`, `find`, or inline `python3` file-patching scripts. Always use `read` (with `offset`/`limit`), `grep`, `glob`, `edit` (exact surgical replacement), and `write`. Reserve `bash` strictly for builds, tests, linters, git, servers, and runtime checks.
      2. Batch independent work — issue independent `read`, `grep`, and `glob` calls together in one turn instead of one-by-one.
      3. Verify after editing — after modifying code, run the fastest relevant syntax, type, lint, or unit check (e.g., `node --check`, `python3 -m py_compile`, `pytest`, compiler/build) before moving on or reporting completion. Fix errors immediately.
      4. Stay concise and concrete — keep internal reasoning focused on concrete hypotheses and direct next actions; avoid long repetitive monologues when a targeted `read`, `edit`, or test gives the exact answer.
      5. Keep context lean — filter verbose command output (`| tail -n 60`, quiet test flags). When using `read_image`, take only 1-2 targeted verification screenshots per milestone because images stay in context and prevent later KV checkpoints.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 32768

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    readLimit: 400
    readMaxLineLength: 2000
    readMaxBytes: 32768

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills (disabled by default: no local skills configured; set false to enable) ──

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: true

# ── goals (disabled by default to keep GBNF grammar & prompt lean; set false to enable) ──

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
  disabled: true

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first using read, grep, glob, and non-mutating checks. Do not edit or write files or mutate state. Prefer existing functions and patterns over new machinery.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity. Make the plan concise, concrete, and decision-complete (goal, subsystem changes, edge cases, verification steps).

              When ready, call exit_plan_mode with the complete plan markdown starting with `# ` as the only tool call in that response.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.72
        retainTokens: 16384
        maxTokens: 16384

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      disabled: true
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows (disabled on --parallel 1 single-GPU to avoid KV eviction; set false to enable) ──

- id: delegation
  name: cordis:group
  group: true
  disabled: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-worktree
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_worktree
        enableRunInBackground: false
        worktree: isolated
        maxDepth: 3

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: true
  config:
    fetch: false
    searchTimeoutMs: 60000
