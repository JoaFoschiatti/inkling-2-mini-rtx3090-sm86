agent-default-model:
  provider: inkling-local
  model: inkling-2-mini
  reasoningEffort: medium

llm-pi-ai:
  providers:
    inkling-local:
      displayName: Inkling 2 Mini (Local RTX 3090)
      api: openai-completions
      baseURL: http://127.0.0.1:8081/v1
      apiKeyEnv: INKLING_LOCAL_API_KEY
      models:
        - id: inkling-2-mini
          name: Inkling 2 Mini (UD-Q4_K_XL · SM86 Wave 10 · 128K)
          contextWindow: 131072
          maxTokens: 32768
          input:
            - text
            - image
          reasoningEfforts:
            off: none
            minimal: minimal
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
          compat:
            supportsStore: false
            supportsDeveloperRole: false
            supportsReasoningEffort: true
            supportsUsageInStreaming: true
            maxTokensField: max_tokens
            requiresToolResultName: true
            thinkingFormat: openai
